services:
  - type: web
    name: nutech-api
    env: node
    region: singapore  # Closer to your Supabase (ap-southeast-1)
    plan: free
    buildCommand: |
      npm ci --only=production
      echo "Build completed successfully"
    startCommand: npm start
    healthCheckPath: /health
    initialDelaySec: 30
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # DO NOT put secrets here! Set them in Render dashboard